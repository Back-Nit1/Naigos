[project]
name = "naigos"
version = "0.1.0"
description = "Survivable routing in contested 3D airspace via multi-agent RL. Blue is purely evasive."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Layered installs (spec section 9): each slice verifies on its own.
research = [
  "requests>=2.31",
  "py3dep>=0.16",
  "rasterio>=1.3",
  "xarray>=2023.1",
  # LAZ decoding for the physics-grade urban obstacle build (naigos.research.sources.urban_physics).
  # Imported only when a lidar tile is actually downloaded; a cached rerun never needs it.
  "laspy[lazrs]>=2.5",
]
data = ["numpy>=1.24", "rasterio>=1.3"]
# orbax-checkpoint was already a transitive dependency of flax; naigos/rl/checkpoint.py
# now imports it directly (next-steps.md G-3 -- no more pickle), so it is pinned here too.
rl  = ["jax>=0.4.30", "flax>=0.8", "optax>=0.2", "distrax>=0.1.5", "orbax-checkpoint>=0.5"]
# `replay.py` renders the learning-delta figure with matplotlib. Plotly remains
# available for exploratory plots; the shipped 3D replay uses a self-contained
# three.js page and the live globe uses CesiumJS in the browser.
demo = ["matplotlib>=3.8", "plotly>=5.20"]
# Optional offline nonlinear validation boundary. Core PPO never imports this;
# model/configuration bytes must also be supplied locally with pinned hashes.
validation = ["jsbsim==1.2.3"]
dev = ["pytest>=8.0"]
# Offline high-level planner training. Deliberately excluded from `all`: the
# JAX simulator/control stack must not acquire a Torch dependency merely because
# a planner experiment is available.
planner = [
  "torch>=2.4",
  "transformers>=4.51,<5",
  "peft>=0.14",
  "accelerate>=1.2",
  "safetensors>=0.4",
]
# Everything needed to run the full suite and the demo in one go.
all = ["naigos[research,data,rl,demo,validation,dev]"]

[project.scripts]
naigos-research = "naigos.research.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["naigos*"]

[tool.setuptools.package-data]
# The pipeline's checked-in default configuration (schedule, gates, seeds).
"naigos.pipeline" = ["default_config.json"]
# File-defined theatres, discovered at import (naigos.research.aoi).
"naigos.research" = ["aois/*.json"]
# Immutable upstream revision and per-file hashes for local Qwen assets.
"naigos.planner" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
